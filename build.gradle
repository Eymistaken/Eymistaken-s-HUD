plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral() // Bu çok önemli, bunu mutlaka geri ekle
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    // 1. Minecraft'ın kendisi
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    // 2. MAPPINGS (BUNU UNUTMUŞTUK!)
    // Lütfen kendi eski build.gradle dosyanda yazan mappings satırını buraya ekle.
    // Eğer hatırlamıyorsan genellikle şöyledir: mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    // (Bunu kullanırsan gradle.properties dosyanda yarn_mappings sürümünün yazması gerekir)
    
    // 3. Loader ve API
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 4. ModMenu
    modImplementation "com.terraformersmc:modmenu:18.0.0-alpha.8"
    
    // 5. Cloth Config
    modApi("me.shedaniel.cloth:cloth-config-fabric:26.1.154") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include "me.shedaniel.cloth:cloth-config-fabric:26.1.154"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version as int
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
