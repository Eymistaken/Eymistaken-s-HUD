// Shared by every node. Stonecutter runs this once per versions/<node> project, with that
// node's gradle.properties layered over the root one.
plugins {
    // Applies fabric-loom-remap on 1.21.x and fabric-loom on 26.x (see settings.gradle), and
    // gives the 26.x nodes the mod* configurations too, so one dependency block serves both.
    id 'dev.kikugie.loom-back-compat'
    id 'maven-publish'
}

// eymistakens-hud-<mod_version>+<jar_label>.jar, with the same version in fabric.mod.json.
version = "${project.mod_version}+${project.jar_label}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Mojang's names for the obfuscated 1.21.x game; nothing on 26.x, which ships them.
    loomx.applyMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ModMenu only supplies the entrypoint that opens HudSettingsScreen; the screen
    // itself is plain Minecraft, so the mod has no GUI library dependency at runtime.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// Names that differ between the 26.x and 1.21.x games, swapped across the whole source
// when Stonecutter writes it for a node. src/ is committed with the 26.x names, and a node
// below each bound gets the old ones. The 1.21.x jar is remapped to intermediary names, so
// the 1.21.9 name still runs on 1.21.11, where ResourceLocation is called Identifier.
// Only names nothing else in the mod uses belong here. The drawing calls (text, item and
// the rest) are switched in compat.Draw instead, because SettingsTheme.text and
// EymHudFonts.text are this mod's own methods with the same names.
stonecutter {
    replacements.regex(current.parsed.matches('>=26.1')) {
        replace '\\bGuiGraphics\\b', 'GuiGraphicsExtractor', '\\bGuiGraphicsExtractor\\b', 'GuiGraphics'
    }
    replacements.regex(current.parsed.matches('>=1.21.11')) {
        replace '\\bResourceLocation\\b', 'Identifier', '\\bIdentifier\\b', 'ResourceLocation'
    }
    // Fabric API renamed these during 26.1: key registration took Mojang's names with the
    // game, and resource-loader-v1's registerReloader became registerReloadListener.
    replacements.string(current.parsed.matches('>=26.1')) {
        replace 'client.keybinding.v1.KeyBindingHelper', 'client.keymapping.v1.KeyMappingHelper'
        replace 'KeyBindingHelper.registerKeyBinding', 'KeyMappingHelper.registerKeyMapping'
        replace '.registerReloader(', '.registerReloadListener('
    }
    // A screen draws itself in extractRenderState on 26.x and in render on 1.21.x. Only
    // the overrides of the screen method change, picked out by its four parameters
    // (graphics, mouse x and y, partial tick), and the super calls inside them. HudModule's
    // extractRenderState is this mod's own API and keeps its name everywhere; it takes two.
    replacements.regex(current.parsed.matches('>=26.1')) {
        replace '\\brender(?=\\(GuiGraphics \\w+, int \\w+, int \\w+, float \\w+\\))', 'extractRenderState',
            '\\bextractRenderState(?=\\(GuiGraphicsExtractor \\w+, int \\w+, int \\w+, float \\w+\\))', 'render'
        replace '\\bsuper\\.render(?=\\(\\w+, \\w+, \\w+, \\w+\\))', 'super.extractRenderState',
            '\\bsuper\\.extractRenderState(?=\\(\\w+, \\w+, \\w+, \\w+\\))', 'super.render'
    }
}

// Mixins only some nodes have, appended to the shared list in simplecps.mixins.json.
// 26.3 sends other players' arm swings as their own packet, and this mixin injects into its
// handler. Before 26.3 that handler does not exist: a swing is an action of
// ClientboundAnimatePacket, which MixinClientPacketListener already reads.
def nodeMixins = []
if (stonecutter.eval(stonecutter.current.version, '>=26.3')) {
    nodeMixins << 'MixinClientPacketListenerSwing'
}

loom {
    // The 26.3 dev client keeps the run/ folder at the repository root, with its config
    // and world. Older nodes get their own (versions/<node>/run, Loom's default): a world
    // or options.txt saved by a newer game does not open in an older one.
    if (project.name == '26.3') {
        runConfigs.configureEach {
            runDir = '../../run'
        }
    }
}

// The dev client runs on the Java its players run, not on Gradle's: 21 for 1.21.x.
tasks.withType(JavaExec).matching { it.name.startsWith('run') }.configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
}

processResources {
    def props = [
        version    : project.version,
        mc_dep     : project.mc_dep,
        fabric_dep : project.fabric_api_dep,
        java       : project.java_version,
        node_mixins: nodeMixins.collect { ",\n        \"${it}\"" }.join(''),
    ]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'simplecps.mixins.json']) {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version as int
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

// Every node's jars in one folder, build/libs/ at the repository root, for the release.
// On 1.21.x the jar to ship is the remapped one (remapJar); loomx.modJar picks it per node.
tasks.register('collectJars', Copy) {
    group = 'build'
    description = "Copies this node's mod and sources jars to the root build/libs/."
    from loomx.modJar, loomx.modSourcesJar
    into rootProject.layout.buildDirectory.dir('libs')
}

// Add-ons get the mod through JitPack as com.github.Eymistaken:Eymistaken-s-HUD. JitPack hands
// that line to the build's one module, and when a build publishes several modules it turns
// the line into an aggregate of all of them, which would put every jar on an add-on's
// classpath. Three nodes publishing the same coordinates is no better: the last one written
// wins. So the 26.3 node alone publishes, under the coordinates the build had before it had
// nodes, and carries the other nodes' jars beside its own, each under a classifier named
// after its jar_label (com.github.Eymistaken:Eymistaken-s-HUD:<version>:1.21.9-1.21.11@jar).
// The pom's dependencies are the 26.3 jar's, and the @jar in that line is what makes Gradle
// skip them.
if (project.name == '26.3') {
    def otherNodes = rootProject.childProjects.values().findAll {
        it != project && it.hasProperty('jar_label')
    }
    otherNodes.each { evaluationDependsOn(it.path) }

    // The pom alone, no Gradle module metadata: that marks the whole module as needing the
    // 26.3 jar's Java 25, and Gradle checks the mark before it looks at the classifier, so a
    // 1.21.x add-on on Java 21 could not resolve its own jar. Everything else the metadata
    // said, the pom says too.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = rootProject.name
                version = project.mod_version
                otherNodes.each { node ->
                    artifact(node.loomx.modJar) {
                        classifier = node.jar_label
                    }
                }
            }
        }
    }
}
