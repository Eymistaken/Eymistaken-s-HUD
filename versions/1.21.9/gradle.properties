# Runs on Minecraft 1.21.9, 1.21.10 and 1.21.11. Compiled against 1.21.9: the game is
# obfuscated, so the jar is remapped to intermediary names, and those stay the same across
# the range even where a Mojang name changed (ResourceLocation became Identifier in 1.21.11).
minecraft_version=1.21.9
loader_version=0.19.5
fabric_version=0.134.1+1.21.9
modmenu_version=16.0.1
java_version=21

# fabric.mod.json's Minecraft range, and the suffix on the jar's name and version.
mc_dep=>=1.21.9 <=1.21.11
jar_label=1.21.9-1.21.11

# Fabric API builds for 1.21.9 before 0.133.9 lack resource-loader-v1, where this mod
# registers its reload listener. Every build for 1.21.10 and 1.21.11 has it.
fabric_api_dep=>=0.133.9
