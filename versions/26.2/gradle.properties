# Runs on Minecraft 26.1, 26.1.1, 26.1.2 and 26.2. Compiled against 26.2; the few calls
# 26.1 keeps elsewhere are looked up at run time in compat.Screens.
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.161.0+26.2
modmenu_version=20.0.3
java_version=25

# fabric.mod.json's Minecraft range, and the suffix on the jar's name and version.
mc_dep=>=26.1 <26.3
jar_label=26.1-26.2

# Fabric API builds for 26.1 before 0.140.3 lack KeyMappingHelper and the
# Identifier-keyed reload listener this mod registers.
fabric_api_dep=>=0.140.3
