pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'KikuGie Releases'
            url = 'https://maven.kikugie.dev/releases/'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
    // Picks the Loom each node needs: fabric-loom-remap with Mojang mappings below 26.1,
    // where the game is obfuscated, and plain fabric-loom from 26.1 on. The Loom version
    // is loomx.loom_version in gradle.properties.
    id 'dev.kikugie.loom-back-compat' version '0.4.3'
}

// One source tree, one jar per node. Each node is compiled against one Minecraft version
// and runs on the range in its mc_dep; the values that differ live in
// versions/<node>/gradle.properties.
stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(getRootProject()) {
        // 26.2 runs on 26.1 to 26.2: the jar is built against the newest of them, and
        // compat.Screens finds the three calls 26.1 keeps elsewhere at run time.
        // 1.21.9 runs on 1.21.9 to 1.21.11: the game is obfuscated there and the jar is
        // remapped to intermediary names, which stay the same across the three even where
        // Mojang's change. It is built against the oldest of them.
        versions '26.3', '26.2', '1.21.9'
        // The state src/ is committed in; see stonecutter.active.
        vcsVersion = '26.3'
    }
}

rootProject.name = 'simplecps'
