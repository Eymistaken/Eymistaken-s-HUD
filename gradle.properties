org.gradle.jvmargs=-Xmx3G
mod_version = 1.2.5-1
maven_group = com.eymistaken.simplecps
archives_base_name = eymistakens-hud

# Everything that differs per Minecraft version is in versions/<node>/gradle.properties.

# The Loom every node uses. loom-back-compat (settings.gradle) applies fabric-loom-remap
# for the obfuscated 1.21.x node and fabric-loom for 26.x. fabric-loom-remap 1.17 needs
# Gradle 9.5; this build is on 9.4.
loomx.loom_version=1.16-SNAPSHOT

# Stonecutter: this build is written in Groovy, not Kotlin.
dev.kikugie.stonecutter.hard_mode=true
